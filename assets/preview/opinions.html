<!doctype html>
<!-- The picture a link straight into Where You Stand is shown with
     (start/opinions/index.html names it as its og:image). card.html's look,
     with the level's plane beside the name instead of the wheel behind it: the
     plane is stance.js's restated rather than drawn by it — the same four
     corners, colours and mottos, a point of gold with the average person's
     dashed ring — so the figure can change without moving this, and a change
     worth copying across is copied by hand. opinions.jpg beside it is this,
     photographed by make.py. -->
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>The Abyss Test: Where You Stand preview card</title>
        <style>
            :root {
                --bg: #05070d;
                --muted: #d2d8e7;
                --cream: #f3e3c3;
                --gold: #d9a441;
                --serif: ui-serif, "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
                --sans: ui-sans-serif, system-ui, sans-serif;
            }

            html,
            body {
                margin: 0;
                width: 1200px;
                height: 630px;
                overflow: hidden;
                background: var(--bg);
            }

            .card {
                position: relative;
                width: 1200px;
                height: 630px;
                font-family: var(--sans);
                color: var(--muted);
                background-image: radial-gradient(70% 80% at 76% 52%, rgba(124, 92, 255, 0.16), transparent 62%),
                    radial-gradient(90% 55% at 8% 4%, rgba(34, 211, 238, 0.1), transparent 62%),
                    radial-gradient(140% 100% at 50% 120%, rgba(3, 4, 8, 0.9), transparent 55%),
                    linear-gradient(180deg, #090d18 0%, var(--bg) 45%, #020308 100%);
            }

            .logos {
                position: absolute;
                top: 34px;
                left: 64px;
                display: flex;
                align-items: center;
                gap: 20px;
            }

            .logos img {
                height: 44px;
                width: auto;
            }

            .words {
                position: absolute;
                left: 64px;
                top: 150px;
                width: 520px;
            }

            .the {
                font-size: 19px;
                font-weight: 600;
                letter-spacing: 0.5em;
                text-transform: uppercase;
                margin: 0;
            }

            .title {
                margin: 18px 0 0;
                font-family: var(--serif);
                font-size: 84px;
                font-weight: 400;
                line-height: 1.02;
                color: var(--cream);
            }

            .sub {
                margin: 24px 0 0;
                font-family: var(--serif);
                font-size: 29px;
                font-style: italic;
                line-height: 1.3;
                color: #c8cfe4;
            }

            .meta {
                margin: 34px 0 0;
                font-size: 13.5px;
                letter-spacing: 0.12em;
                white-space: nowrap;
                text-transform: uppercase;
            }

            .meta i {
                font-style: normal;
                opacity: 0.45;
                margin: 0 5px;
            }

            /* The plane and its four poles, as .stance__map lays them out. */
            .map {
                position: absolute;
                left: 668px;
                top: 60px;
                width: 470px;
                height: 510px;
            }

            .plane {
                position: absolute;
                left: 55px;
                top: 75px;
                width: 360px;
                height: 360px;
                border-radius: 18px;
                box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08), 0 30px 80px rgba(0, 0, 0, 0.6);
            }

            .pole {
                position: absolute;
                font-size: 15px;
                font-weight: 700;
                letter-spacing: 0.2em;
                text-transform: uppercase;
                color: #e8ecf6;
                text-align: center;
            }

            .pole--top {
                top: 36px;
                left: 0;
                right: 0;
            }

            .pole--bottom {
                bottom: 40px;
                left: 0;
                right: 0;
            }

            .pole--left,
            .pole--right {
                top: 255px;
                transform: translateY(-50%) rotate(-90deg);
                width: 120px;
            }

            .pole--left {
                left: -48px;
            }

            .pole--right {
                right: -48px;
                transform: translateY(-50%) rotate(90deg);
            }
        </style>
    </head>
    <body>
        <div class="card">
            <div class="logos">
                <img src="../logo_sussex.svg" alt="" />
                <img src="../logo_researchplus.png" alt="" />
                <img src="../logo_rebel.png" alt="" />
            </div>

            <div class="words">
                <p class="the">The Abyss</p>
                <h1 class="title">What do you stand for?</h1>
                <p class="sub">Sharing or markets, freedom or order: find out where your views fall</p>
                <p class="meta">Research-grade measures <i>·</i> <span data-minutes="Opinions">immediate results</span> <i>·</i> entirely anonymous</p>
            </div>

            <div class="map">
                <div class="pole pole--top">Order</div>
                <div class="pole pole--bottom">Freedom</div>
                <div class="pole pole--left">Sharing</div>
                <div class="pole pole--right">Markets</div>

                <svg class="plane" viewBox="0 0 360 360">
                    <defs>
                        <clipPath id="edge"><rect width="360" height="360" rx="18" /></clipPath>
                        <radialGradient id="tl" cx="0" cy="0" r="1.1"><stop offset="0" stop-color="#f0a04b" stop-opacity="0.34" /><stop offset="1" stop-color="#f0a04b" stop-opacity="0" /></radialGradient>
                        <radialGradient id="tr" cx="1" cy="0" r="1.1"><stop offset="0" stop-color="#e45f86" stop-opacity="0.34" /><stop offset="1" stop-color="#e45f86" stop-opacity="0" /></radialGradient>
                        <radialGradient id="bl" cx="0" cy="1" r="1.1"><stop offset="0" stop-color="#4fd1a1" stop-opacity="0.34" /><stop offset="1" stop-color="#4fd1a1" stop-opacity="0" /></radialGradient>
                        <radialGradient id="br" cx="1" cy="1" r="1.1"><stop offset="0" stop-color="#7f86ff" stop-opacity="0.62" /><stop offset="1" stop-color="#7f86ff" stop-opacity="0" /></radialGradient>
                        <radialGradient id="glow"><stop offset="0" stop-color="#ffe7a8" stop-opacity="0.75" /><stop offset="0.35" stop-color="#d9a441" stop-opacity="0.28" /><stop offset="1" stop-color="#d9a441" stop-opacity="0" /></radialGradient>
                    </defs>
                    <g clip-path="url(#edge)">
                        <rect width="360" height="360" fill="#070b14" />
                        <rect width="180" height="180" fill="url(#tl)" />
                        <rect x="180" width="180" height="180" fill="url(#tr)" />
                        <rect y="180" width="180" height="180" fill="url(#bl)" />
                        <rect x="180" y="180" width="180" height="180" fill="url(#br)" />
                        <g stroke="rgba(255,255,255,0.06)">
                            <path d="M36 0V360M72 0V360M108 0V360M144 0V360M216 0V360M252 0V360M288 0V360M324 0V360" />
                            <path d="M0 36H360M0 72H360M0 108H360M0 144H360M0 216H360M0 252H360M0 288H360M0 324H360" />
                        </g>
                        <g stroke="rgba(255,255,255,0.32)">
                            <path d="M180 0V360M0 180H360" />
                        </g>
                        <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" letter-spacing="2.2" fill="rgba(255,255,255,0.42)">
                            <text x="16" y="28">PROTECT &amp; PROVIDE</text>
                            <text x="344" y="28" text-anchor="end">REWARD &amp; RULES</text>
                            <text x="16" y="342">FAIR &amp; FREE</text>
                            <text x="344" y="342" text-anchor="end" fill="rgba(255,255,255,0.85)">CHOOSE &amp; COMPETE</text>
                        </g>
                        <!-- The average person, a thread from them, and the point of gold. -->
                        <circle cx="146" cy="150" r="9" fill="none" stroke="rgba(255,255,255,0.6)" stroke-width="1.5" stroke-dasharray="3 3" />
                        <path d="M146 150L244 214" stroke="rgba(217,164,65,0.55)" stroke-width="1.2" stroke-dasharray="2 4" />
                        <circle cx="244" cy="214" r="62" fill="url(#glow)" />
                        <circle cx="244" cy="214" r="21" fill="none" stroke="rgba(255,231,168,0.25)" stroke-width="1.5" />
                        <circle cx="244" cy="214" r="13" fill="none" stroke="#fff4d6" stroke-width="2" />
                        <circle cx="244" cy="214" r="9" fill="var(--gold)" />
                    </g>
                </svg>
            </div>
        </div>
        <!-- resume.js first: the timeline draws its shuffles off its chance(). -->
        <script src="../../js/resume.js"></script>
        <script src="../../content/timeline.js"></script>
        <script src="minutes.js"></script>
    </body>
</html>
