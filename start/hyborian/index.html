<!doctype html>
<!-- A way into the test that opens on the Hyborian Age, with a preview of its own.
     The level is asked by no battery (ASIDE in content/timeline.js), so this
     page, or a link carrying ?start=hyborian, is the only way anybody meets it.
     A crawler reads the tags below and runs no script, so a link to this page
     unfurls with the level's card (assets/preview/hyborian.jpg, photographed
     from hyborian.html by make.py there) rather than the test's; a person is
     sent straight on to the test with ?start=hyborian, and whatever else the
     link carried (?source=, ?sub=, ?battery=, ?test=) goes with them, and a
     ?start= of its own is kept behind this level. Nothing
     of the app is loaded here. Like the root page, no og:url, on purpose; the
     image's ?v= is raised whenever the picture changes, or the apps that cache
     a preview by its address go on showing the old one. "Conan" is nowhere
     here, being a live trademark (see content/block_hyborian.js). -->
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Which Hyborian hero are you? · The Abyss Test</title>
        <meta name="description" content="Barbarian, thief, pirate queen or sorcerer: find out who you would have been in Robert E. Howard's Hyborian Age." />
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="The Abyss Test" />
        <meta property="og:title" content="Which Hyborian hero are you? · The Abyss Test" />
        <meta property="og:description" content="Barbarian, thief, pirate queen or sorcerer: answer 24 statements on the philosophy of Robert E. Howard's Hyborian Age and find the hero you would have been. Part of a research project, results in 3 minutes, entirely anonymous." />
        <meta property="og:image" content="https://realitybendinglab.com/TestYourself/assets/preview/hyborian.jpg?v=1" />
        <meta property="og:image:type" content="image/jpeg" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta property="og:image:alt" content="The Abyss: which Hyborian hero are you? A fan of four painted cards, a pirate queen and a barbarian swordsman in front" />
        <meta name="twitter:card" content="summary_large_image" />
        <script>
            const query = new URLSearchParams(location.search)
            // This level first, then any the link names after it (`?start=` or its shorthand `?st=`): start/hyborian/?start=a,b is ?start=hyborian,a,b.
            const after = (query.get("start") || query.get("st") || "").split(",").filter((name) => name && name !== "hyborian")
            query.delete("st")
            query.set("start", ["hyborian"].concat(after).join(","))
            location.replace("../../?" + query.toString())
        </script>
        <style>
            body {
                margin: 0;
                min-height: 100vh;
                display: grid;
                place-items: center;
                background: #05070d;
                color: #d2d8e7;
                font-family: ui-sans-serif, system-ui, sans-serif;
            }

            a {
                color: #f3e3c3;
            }
        </style>
    </head>
    <body>
        <p><a href="../../?start=hyborian">Take the Abyss Test</a></p>
    </body>
</html>
