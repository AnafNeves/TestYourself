<!doctype html>
<!-- A way into the test that opens on the Archetypes level, with a preview of its own.
     A crawler reads the tags below and runs no script, so a link to this page
     unfurls with the level's card (assets/preview/archetypes.jpg, photographed
     from archetypes.html by make.py there) rather than the test's; a person is
     sent straight on to the test with ?start=archetypes, and whatever else the
     link carried (?source=, ?sub=, ?battery=, ?test=) goes with them, and a
     ?start= of its own is kept behind this level. Nothing
     of the app is loaded here. Like the root page, no og:url, on purpose; the
     image's ?v= is raised whenever the picture changes, or the apps that cache
     a preview by its address go on showing the old one. -->
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Which story are you living? · The Abyss Test</title>
        <meta name="description" content="Twelve archetypes, from the Seeker to the Ruler: find the ones loudest in you." />
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="The Abyss Test" />
        <meta property="og:title" content="Which story are you living? · The Abyss Test" />
        <meta property="og:description" content="Twelve archetypes, from the Seeker to the Ruler: find the ones loudest in you. Research-grade measures, immediate results, entirely anonymous." />
        <meta property="og:image" content="https://realitybendinglab.com/TestYourself/assets/preview/archetypes.jpg?v=1" />
        <meta property="og:image:type" content="image/jpeg" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta property="og:image:alt" content="The Abyss: which story are you living? A wheel of twelve archetypes, each a petal, the longest picked out" />
        <meta name="twitter:card" content="summary_large_image" />
        <script>
            const query = new URLSearchParams(location.search)
            // This level first, then any the link names after it: start/archetypes/?start=a,b is ?start=archetypes,a,b.
            const after = (query.get("start") || "").split(",").filter((name) => name && name !== "archetypes")
            query.set("start", ["archetypes"].concat(after).join(","))
            location.replace("../../?" + query.toString())
        </script>
        <style>
            body {
                margin: 0;
                min-height: 100vh;
                display: grid;
                place-items: center;
                background: #05070d;
                color: #d2d8e7;
                font-family: ui-sans-serif, system-ui, sans-serif;
            }

            a {
                color: #f3e3c3;
            }
        </style>
    </head>
    <body>
        <p><a href="../../?start=archetypes">Take the Abyss Test</a></p>
    </body>
</html>
